services:
  db:
    image: postgres:16
    container_name: barbearia_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Dados persistem entre restarts do container
      - barbearia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - barbearia_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barbearia_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # Flyway roda automaticamente no boot do Spring, aplicando
      # os arquivos de src/main/resources/db/migration/V1__..., V2__... etc.
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      - barbearia_net

volumes:
  barbearia_pgdata:

networks:
  barbearia_net:
    driver: bridge